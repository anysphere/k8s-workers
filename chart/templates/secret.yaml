{{- if and .Values.auth.apiKey (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cursor-worker-pool.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cursor-worker-pool.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.apiKey | quote }}
{{- end }}
