{{- $_ := include "cursor-worker-pool.validate" . }}
{{- if and .Values.controller.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cursor-worker-pool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cursor-worker-pool.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  {{- if .Values.auth.sessionToken }}
  # delete only removes a Pod whose token Secret could not be created.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  # create only: the controller can add token Secrets but cannot read, change,
  # or delete any Secret, including the one holding the API key.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- else }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list"]
  {{- end }}
  {{- if .Values.hibernation.enabled }}
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cursor-worker-pool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cursor-worker-pool.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cursor-worker-pool.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cursor-worker-pool.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
