{{- $_ := include "cursor-worker-pool.validate" . }}
{{- if and .Values.controller.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cursor-worker-pool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cursor-worker-pool.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list"]
  {{- if .Values.hibernation.enabled }}
  # Spawn hook: create-if-missing ws-<worker-id>, and patch for the
  # last-used annotations the reaper reads.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cursor-worker-pool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cursor-worker-pool.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cursor-worker-pool.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cursor-worker-pool.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
