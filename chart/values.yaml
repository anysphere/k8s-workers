# Cursor Self-Hosted Pool name passed to `agent worker controller --pool`
# and to each spawned worker (`agent worker --pool`).
pool: default

# Seconds a worker may stay connected after becoming idle before it exits 0.
# Combined with restartPolicy: Never on the spawned Pod, that exit is terminal
# (the Pod goes Succeeded). Matches the public Kubernetes docs default.
idleReleaseTimeout: 600

# Workspace root passed to `agent worker --worker-dir`. Must exist in the image
# (or be created by an init container / extra volume). Empty omits the flag.
workerDir: /workspace

# Listen address for GET /healthz, /readyz, and /metrics on worker Pods.
managementAddr: "0.0.0.0:8080"

image:
  # Customer-built worker image: `agent` CLI + git + a cloned repo.
  # The in-cluster controller uses this image too unless controller.image is set.
  # The controller container also needs `kubectl` on PATH (spawn hook).
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Extra `--label key=value` flags for spawned workers (pool routing). These are
# not Kubernetes pod labels.
labels: []
  # - team=backend
  # - env=production

command:
  - agent

# Extra CLI args inserted before `start` on spawned worker Pods.
extraArgs: []

auth:
  # Name of an existing Secret that holds the team service account API key.
  existingSecret: ""
  # Key inside the Secret (created or existing).
  secretKey: api-key
  # If set and existingSecret is empty, the chart creates a Secret. Do not
  # commit a real key; pass --set auth.apiKey=... or a values overlay.
  apiKey: ""

# In-cluster `agent worker controller`. Workers are created by --spawn as
# standalone Pods (kubectl create), not by patching a Deployment or HPA.
controller:
  enabled: true
  # Optional `--warm-idle <count>`. 0 omits the flag (claim-then-spawn).
  # A positive integer keeps that many idle workers in `pool` by running the
  # spawn hook once per missing warm worker. The CLI rejects 0 as a flag value,
  # so this chart only passes the flag when warmIdle > 0.
  warmIdle: 0
  # Optional `--repository <url>` on the controller (repo-scoped keys / warm
  # stats pin). Empty omits the flag.
  repository: ""
  # Optional override of the controller public API base (`CURSOR_API_ENDPOINT`).
  # Empty uses the CLI default (https://api.cursor.com).
  endpoint: ""
  # Extra CLI args on the controller process (after --spawn / --pool / --warm-idle).
  extraArgs: []
  # Optional controller image. Empty uses `image` above. Must include `agent`
  # and `kubectl`.
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# Opt-in workspace hibernation. Off by default, and off means exactly the
# chart you have without this block: one-shot Pods, no PersistentVolumeClaims,
# no CronJob, no extra RBAC.
#
# Hibernation needs two independent gates, both default off:
#   1. hibernation.enabled=true here (cluster side).
#   2. A non-zero workerReadyTimeoutSeconds on the pool in Cursor
#      (POST /v0/private-workers/pools). NOTES.txt prints the call. Without it
#      Cursor never asks for a wake, and the PVCs are created but never reused.
#
# What it does when on: each worker id gets a PersistentVolumeClaim
# ws-<worker-id> mounted at workerDir. The worker still exits 0 after
# idleReleaseTimeout and its Pod goes Succeeded, but the volume stays. When a
# follow-up arrives inside the pool's window, the controller runs the spawn
# hook with CURSOR_WAKE=1 and the same worker id; the hook mounts the same
# PVC into a new Pod and the agent resumes on its files. Disk only: processes,
# tmux sessions, and anything outside the mounted paths do not survive.
hibernation:
  enabled: false
  # Reconnect window to set on the pool in Cursor (workerReadyTimeoutSeconds,
  # 1..3600). Printed in NOTES.txt; the chart cannot set it on the pool itself.
  # Wake (schedule + image pull + volume attach + connect + node scale-up) must
  # finish inside this window and inside idleReleaseTimeout.
  wakeWindowSeconds: 900
  # Per-worker PVC spec. Empty storageClassName uses the default StorageClass.
  # A cluster with no default leaves the claim Pending ("no storage class is
  # set"). Prefer a class with volumeBindingMode: WaitForFirstConsumer and
  # encryption at rest: the volume holds a checkout and possibly credential
  # residue.
  storageClassName: ""
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  # Also persist a home directory (subPath home of the same PVC) at homeDir.
  # Off by default: it keeps credential residue between episodes and shadows
  # dotfiles baked into the image at homeDir.
  mountHome: false
  homeDir: /root
  # How an empty workspace volume is populated on first use. The PVC mount
  # shadows whatever the image baked into workerDir, so a repo-bound image
  # should bake its clone elsewhere and set seed.fromPath, or set
  # seed.cloneUrl (git on PATH, credentials via extraEnv/volumes). Leave both
  # empty for any-repo pools; the agent clones into the empty workspace.
  seed:
    fromPath: ""
    cloneUrl: ""
  # Delete PVCs not used by a spawn or wake for this long. Format: <n>s, <n>m,
  # <n>h or <n>d. Every worker id that ever ran leaves a PVC behind until then.
  pvcTtl: 72h
  # Delete Succeeded/Failed worker Pods older than this. Finished Pods hold a
  # kubernetes.io/pvc-protection finalizer on their PVC, so the reaper removes
  # them before the PVC.
  podTtl: 1h
  reaper:
    # CronJob that applies pvcTtl and podTtl. Rendered only with
    # hibernation.enabled. Cursor never deletes Kubernetes objects.
    enabled: true
    schedule: "*/15 * * * *"
    # Image with kubectl and a POSIX shell. Empty uses the controller image.
    # The Job runs reaper.sh, not `command`, so a start script that installs
    # kubectl for the controller does not apply here.
    image:
      repository: ""
      tag: ""
      digest: ""
      pullPolicy: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

# Namespace Role granting the controller ServiceAccount create/get/list on Pods
# (plus create/get/list/patch on PersistentVolumeClaims with hibernation).
rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Must stay true while controller.enabled is set: kubectl uses the in-cluster
  # token to create worker Pods.
  automount: true

# Resource requests/limits applied to spawned worker Pods (not the controller).
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

probes:
  readiness:
    path: /readyz
    periodSeconds: 5
    initialDelaySeconds: 15
  liveness:
    path: /healthz
    periodSeconds: 10
    initialDelaySeconds: 30

# Kubernetes labels/annotations on spawned worker Pods.
podLabels: {}
podAnnotations: {}
extraEnv: []
extraVolumeMounts: []
extraVolumes: []

# Pod securityContext for spawned workers. A new hibernation volume is
# root:root mode 755. Set fsGroup to the image user's gid when that user is
# not root, so the kubelet makes the mount group-writable before start.
podSecurityContext: {}
securityContext: {}

terminationGracePeriodSeconds: 30
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
